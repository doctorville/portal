<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>닥터빌 업무 포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--navy:#0f2a4a;--navy2:#1d4370;--blue:#2f6fd6;--bg:#f3f6fa;--line:#dbe3ee;--mut:#64748b;--ok:#0f9d58;--err:#c62828}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;background:var(--bg);color:#1e293b}
  header{background:var(--navy);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
  header .who{font-size:13px;opacity:.85;display:flex;gap:12px;align-items:center}
  header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px}
  main{max-width:980px;margin:0 auto;padding:32px 20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
  .login{max-width:420px;margin:40px auto}
  .login h2{margin:0 0 6px;font-size:20px;color:var(--navy)}
  .login p{margin:0 0 20px;color:var(--mut);font-size:14px;line-height:1.6}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px}
  input:focus{outline:2px solid var(--blue);border-color:transparent}
  .btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:var(--navy2);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .link{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:13px;padding:0;margin-top:12px}
  .msg{margin-top:12px;font-size:13px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .note{font-size:12px;color:var(--mut);margin-top:18px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:18px}
  .svc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--navy2)}
  .svc h3{margin:0;font-size:16px;color:var(--navy)}
  .svc p{margin:0;font-size:13px;color:var(--mut);flex:1}
  .svc .go{align-self:flex-start;padding:8px 14px;border-radius:7px;border:0;background:var(--blue);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .svc.off{opacity:.55;border-top-color:#cbd5e1}
  .svc.off .go{background:#94a3b8;cursor:not-allowed}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#e8f0fb;color:var(--navy2);align-self:flex-start;font-weight:600}
  .svc.off .tag{background:#eef1f5;color:#64748b}
  .hello{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
  .hello h2{margin:0;font-size:20px;color:var(--navy)}
  .hello span{font-size:13px;color:var(--mut)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>닥터빌 업무 포털</h1>
  <div class="who" id="who" hidden><span id="whoEmail"></span><button id="logout">로그아웃</button></div>
</header>
<main>
  <!-- 로그인 -->
  <section class="card login" id="loginView" hidden>
    <h2>통합 로그인</h2>
    <p>각 업무 사이트에 등록된 이메일로 인증 코드를 받아 로그인합니다. 한 번 로그인하면 포털에서 여는 사이트는 따로 인증하지 않아도 됩니다.</p>
    <form id="emailForm">
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="email" required placeholder="name@mcircle.biz">
      <button class="btn" id="sendBtn">인증 코드 받기</button>
    </form>
    <form id="codeForm" hidden>
      <label for="code">인증 코드</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="메일로 받은 코드">
      <button class="btn" id="verifyBtn">로그인</button>
      <button type="button" class="link" id="resend">코드 다시 받기</button> ·
      <button type="button" class="link" id="back">이메일 바꾸기</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <div class="note">계정은 각 서비스 관리자에게 요청해 주세요. 사내 개인정보·전략·계약 자료는 사전 승인 후 다뤄야 합니다.</div>
  </section>

  <!-- 서비스 목록 -->
  <section id="homeView" hidden>
    <div class="hello"><h2>업무 사이트</h2><span id="hint">권한이 있는 사이트만 열 수 있습니다.</span></div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="homeMsg" role="status"></div>
  </section>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var C = window.PORTAL_CONFIG;
  var AUTH = 'https://' + C.nhostSubdomain + '.auth.' + C.nhostRegion + '.nhost.run/v1';
  var FN = 'https://' + C.nhostSubdomain + '.functions.' + C.nhostRegion + '.nhost.run/v1/portal';
  var STORE = 'portal.nhost.session';
  var $ = function (s) { return document.querySelector(s); };
  var session = null, refreshing = null, pendingEmail = '';

  // ── 세션 (Nhost는 refresh token을 회전시키므로 다른 탭 갱신분을 먼저 확인) ──
  function load() { try { var s = JSON.parse(localStorage.getItem(STORE) || 'null'); return s && s.accessToken && s.refreshToken ? s : null; } catch (e) { return null; } }
  function save(s) { session = s; try { s ? localStorage.setItem(STORE, JSON.stringify(s)) : localStorage.removeItem(STORE); } catch (e) {} }
  function fromNhost(s) { return { accessToken: s.accessToken, refreshToken: s.refreshToken, expiresAt: Date.now() + Number(s.accessTokenExpiresIn || 900) * 1000, user: s.user }; }

  function post(url, body, token) {
    var h = { 'Content-Type': 'application/json' };
    if (token) h.Authorization = 'Bearer ' + token;
    return fetch(url, { method: 'POST', headers: h, body: JSON.stringify(body || {}) }).then(function (r) {
      return r.text().then(function (t) { var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {} return { ok: r.ok, status: r.status, json: j }; });
    });
  }

  function token() {
    var latest = load();
    if (latest && (!session || latest.refreshToken !== session.refreshToken)) session = latest;
    if (!session) return Promise.reject(Object.assign(new Error('login'), { status: 401 }));
    if (session.expiresAt - Date.now() > 60000) return Promise.resolve(session.accessToken);
    if (!refreshing) {
      refreshing = post(AUTH + '/token', { refreshToken: session.refreshToken }).then(function (r) {
        if (!r.ok) {
          var again = load();
          if (again && again.refreshToken !== session.refreshToken && again.expiresAt - Date.now() > 60000) { session = again; return again.accessToken; }
          save(null); throw Object.assign(new Error('expired'), { status: 401 });
        }
        var n = fromNhost(r.json); if (!n.user) n.user = session.user; save(n); return n.accessToken;
      }).finally(function () { refreshing = null; });
    }
    return refreshing;
  }

  // ── 화면 ──
  function msg(el, text, kind) { el.textContent = text || ''; el.className = 'msg' + (kind ? ' ' + kind : ''); }
  function showLogin() {
    $('#who').hidden = true; $('#homeView').hidden = true; $('#loginView').hidden = false;
    $('#emailForm').hidden = false; $('#codeForm').hidden = true; $('#email').focus();
  }

  function showHome() {
    return token().then(function (t) { return post(FN + '/me', {}, t); }).then(function (r) {
      if (r.status === 401) { save(null); showLogin(); return; }
      if (!r.ok) throw new Error('me');
      $('#loginView').hidden = true; $('#homeView').hidden = false; $('#who').hidden = false;
      $('#whoEmail').textContent = r.json.email;
      render(r.json.services || {});
    }).catch(function (e) {
      if (e && e.status === 401) { showLogin(); return; }
      $('#homeView').hidden = false; msg($('#homeMsg'), '서비스 권한을 불러오지 못했습니다. 새로고침해 주세요.', 'err');
    });
  }

  function render(svc) {
    var g = $('#grid'); g.innerHTML = '';
    C.services.forEach(function (s) {
      var on = !!svc[s.key];
      var el = document.createElement('div');
      el.className = 'svc' + (on ? '' : ' off');
      el.innerHTML = '<span class="tag"></span><h3></h3><p></p><button class="go"></button>';
      el.querySelector('.tag').textContent = s.mode === 'open' ? '전체 공개' : (on ? '사용 가능' : '권한 없음');
      el.querySelector('h3').textContent = s.name;
      el.querySelector('p').textContent = s.desc;
      var b = el.querySelector('.go');
      b.textContent = on ? '열기' : '권한 요청 필요';
      b.disabled = !on;
      if (on) b.addEventListener('click', function () { openService(s, b); });
      g.appendChild(el);
    });
  }

  // ── 서비스 이동 (팝업 차단을 피하려고 창을 먼저 연 뒤 주소를 넣음) ──
  function openService(s, btn) {
    msg($('#homeMsg'), '');
    if (s.mode === 'open') { window.open(s.url, '_blank', 'noopener'); return; }
    var w = window.open('about:blank', '_blank');
    btn.disabled = true;
    // 같은 Nhost 계정으로 2분짜리 개인 접근 토큰(PAT)을 만들어 넘기면, 각 서비스가 자기 세션을 새로 발급받는다
    // (포털 세션·refresh token을 공유하지 않으므로 서로 로그아웃시키지 않음)
    token().then(function (t) {
      var exp = new Date(Date.now() + C.handoffTtlSec * 1000).toISOString();
      return post(AUTH + '/pat', { expiresAt: exp, metadata: { source: 'portal', app: s.key } }, t);
    }).then(function (r) {
      if (!r.ok || !r.json || !r.json.personalAccessToken) throw new Error('토큰 발급 실패 ' + r.status);
      var pat = r.json.personalAccessToken;
      if (s.mode === 'nhost') {
        // 같은 도메인(doctorville.github.io): localStorage로 전달 → 서비스가 읽자마자 삭제
        localStorage.setItem('portal.handoff.' + s.key, JSON.stringify({ pat: pat, exp: Date.now() + C.handoffTtlSec * 1000 }));
        if (w) w.location.href = s.url; else location.href = s.url;
      } else {
        // 다른 도메인(모니터): 주소창·로그에 남지 않도록 폼 POST 본문으로 전달
        var target = w || window, doc = target.document;
        var f = doc.createElement('form');
        f.method = 'POST'; f.action = s.url.replace(/\/+$/, '') + '/auth/portal';
        var i = doc.createElement('input'); i.type = 'hidden'; i.name = 'pat'; i.value = pat;
        f.appendChild(i); doc.body.appendChild(f); f.submit();
      }
    }).catch(function (e) {
      if (w) w.close();
      if (e && e.status === 401) { save(null); showLogin(); return; }
      msg($('#homeMsg'), s.name + ' 자동 로그인에 실패했습니다. 해당 사이트에서 직접 로그인해 주세요. (' + (e.message || '') + ')', 'err');
    }).finally(function () { btn.disabled = false; });
  }

  // ── 로그인 이벤트 ──
  function sendCode() {
    var email = $('#email').value.trim().toLowerCase();
    $('#sendBtn').disabled = true; msg($('#msg'), '인증 코드를 보내는 중…');
    return post(FN + '/send-code', { email: email }).then(function (r) {
      if (!r.ok) { msg($('#msg'), (r.json && r.json.message) || '인증 코드를 보내지 못했습니다.', 'err'); return; }
      pendingEmail = email;
      $('#emailForm').hidden = true; $('#codeForm').hidden = false; $('#code').value = ''; $('#code').focus();
      msg($('#msg'), email + ' 으로 인증 코드를 보냈습니다.', 'ok');
    }).catch(function () { msg($('#msg'), '서버에 연결하지 못했습니다.', 'err'); })
      .finally(function () { $('#sendBtn').disabled = false; });
  }

  $('#emailForm').addEventListener('submit', function (e) { e.preventDefault(); sendCode(); });
  $('#resend').addEventListener('click', function () { $('#email').value = pendingEmail; sendCode(); });
  $('#back').addEventListener('click', function () { $('#emailForm').hidden = false; $('#codeForm').hidden = true; msg($('#msg'), ''); });

  $('#codeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    $('#verifyBtn').disabled = true; msg($('#msg'), '확인 중…');
    post(AUTH + '/signin/otp/email/verify', { email: pendingEmail, otp: $('#code').value.trim() }).then(function (r) {
      if (!r.ok || !r.json || !r.json.session) { msg($('#msg'), '인증 코드가 맞지 않거나 만료되었습니다.', 'err'); return; }
      save(fromNhost(r.json.session)); msg($('#msg'), ''); return showHome();
    }).catch(function () { msg($('#msg'), '서버에 연결하지 못했습니다.', 'err'); })
      .finally(function () { $('#verifyBtn').disabled = false; });
  });

  $('#logout').addEventListener('click', function () {
    var s = session || load(); save(null);
    if (s) post(AUTH + '/signout', { refreshToken: s.refreshToken }, s.accessToken).catch(function () {});
    showLogin();
  });

  // 다른 탭에서 로그아웃하면 따라서 로그아웃
  window.addEventListener('storage', function (e) { if (e.key === STORE && !e.newValue) showLogin(); });

  session = load();
  session ? showHome() : showLogin();
})();
</script>
</body>
</html>
